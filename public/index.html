  <script>
    // 定义一些常量
    var x_PI = 3.14159265358979324 * 3000.0 / 180.0;
    var PI = 3.1415926535897932384626;
    var a = 6378245.0;
    var ee = 0.00669342162296594323;

    /**
     * 百度坐标系 (BD-09) 与 火星坐标系 (GCJ-02)的转换 / 即百度转谷歌、高德
     * @param { Number } bd_lon
     * @param { Number } bd_lat
     */
    function bd09togcj02(bd_lon, bd_lat) {
      var x_pi = 3.14159265358979324 * 3000.0 / 180.0
      var x = bd_lon - 0.0065
      var y = bd_lat - 0.006
      var z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * x_pi)
      var theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * x_pi)
      var gg_lng = z * Math.cos(theta)
      var gg_lat = z * Math.sin(theta)
      return [gg_lng, gg_lat]
    }

    /**
     * 火星坐标系 (GCJ-02) 与百度坐标系 (BD-09) 的转换 / 即谷歌、高德 转 百度
     * @param { Number } lng
     * @param { Number } lat
     */
    function gcj02tobd09(lng, lat) {
      var z = Math.sqrt(lng * lng + lat * lat) + 0.00002 * Math.sin(lat * x_PI)
      var theta = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * x_PI)
      var bd_lng = z * Math.cos(theta) + 0.0065
      var bd_lat = z * Math.sin(theta) + 0.006
      return [bd_lng, bd_lat]
    }

    /**
     * WGS84坐标系转火星坐标系GCj02 / 即WGS84 转谷歌、高德
     * @param { Number } lng
     * @param { Number } lat
     */
    function wgs84togcj02(lng, lat) {
      if (outOfChina(lng, lat)) {
        return [lng, lat]
      } else {
        var dlat = transformlat(lng - 105.0, lat - 35.0)
        var dlng = transformlng(lng - 105.0, lat - 35.0)
        var radlat = lat / 180.0 * PI
        var magic = Math.sin(radlat)
        magic = 1 - ee * magic * magic
        var sqrtmagic = Math.sqrt(magic)
        dlat = (dlat * 180.0) / ((a * (1 - ee)) / (magic * sqrtmagic) * PI)
        dlng = (dlng * 180.0) / (a / sqrtmagic * Math.cos(radlat) * PI)
        const mglat = lat + dlat
        const mglng = lng + dlng
        return [mglng, mglat]
      }
    }

    /**
     * GCJ02（火星坐标系） 转换为 WGS84 / 即谷歌高德转WGS84
     * @param { Number } lng
     * @param { Number } lat
     */
    function gcj02towgs84(lng, lat) {
      if (outOfChina(lng, lat)) {
        return [lng, lat]
      }
      else {
        var dlat = transformlat(lng - 105.0, lat - 35.0)
        var dlng = transformlng(lng - 105.0, lat - 35.0)
        var radlat = lat / 180.0 * PI
        var magic = Math.sin(radlat)
        magic = 1 - ee * magic * magic
        var sqrtmagic = Math.sqrt(magic)
        dlat = (dlat * 180.0) / ((a * (1 - ee)) / (magic * sqrtmagic) * PI)
        dlng = (dlng * 180.0) / (a / sqrtmagic * Math.cos(radlat) * PI)
        const mglat = lat + dlat
        const mglng = lng + dlng
        return [lng * 2 - mglng, lat * 2 - mglat]
      }
    }

    /**
     * 百度坐标系转wgs84坐标系
     * @param {*} lng
     * @param {*} lat
     */
    function bd09towgs84(lng, lat) {
      // 百度坐标系先转为火星坐标系
      const gcj02 = bd09togcj02(lng, lat)
      // 火星坐标系转wgs84坐标系
      const result = gcj02towgs84(gcj02[0], gcj02[1])
      return result
    }

    /**
     * wgs84坐标系转百度坐标系
     * @param {*} lng
     * @param {*} lat
     */
    function wgs84tobd09(lng, lat) {
      // wgs84先转为火星坐标系
      const gcj02 = wgs84togcj02(lng, lat)
      // 火星坐标系转百度坐标系
      const result = gcj02tobd09(gcj02[0], gcj02[1])
      return result
    }

    /**
     * 经度转换
     * @param { Number } lng
     * @param { Number } lat
     */
    function transformlat(lng, lat) {
      var ret = -100.0 + 2.0 * lng + 3.0 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng))
      ret += (20.0 * Math.sin(6.0 * lng * PI) + 20.0 * Math.sin(2.0 * lng * PI)) * 2.0 / 3.0
      ret += (20.0 * Math.sin(lat * PI) + 40.0 * Math.sin(lat / 3.0 * PI)) * 2.0 / 3.0
      ret += (160.0 * Math.sin(lat / 12.0 * PI) + 320 * Math.sin(lat * PI / 30.0)) * 2.0 / 3.0
      return ret
    }

    /**
     * 纬度转换
     * @param { Number } lng
     * @param { Number } lat
     */
    function transformlng(lng, lat) {
      var ret = 300.0 + lng + 2.0 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng))
      ret += (20.0 * Math.sin(6.0 * lng * PI) + 20.0 * Math.sin(2.0 * lng * PI)) * 2.0 / 3.0
      ret += (20.0 * Math.sin(lng * PI) + 40.0 * Math.sin(lng / 3.0 * PI)) * 2.0 / 3.0
      ret += (150.0 * Math.sin(lng / 12.0 * PI) + 300.0 * Math.sin(lng / 30.0 * PI)) * 2.0 / 3.0
      return ret
    }

    /**
     * 判断是否在国内，不在国内则不做偏移
     * @param {*} lng
     * @param {*} lat
     */
    function outOfChina(lng, lat) {
      return (lng < 72.004 || lng > 137.8347) || ((lat < 0.8293 || lat > 55.8271) || false)
    }

    $colors: hsla(337, 84, 48, 0.75) hsla(160, 50, 48, 0.75) hsla(190, 61, 65, 0.75) hsla(41, 82, 52, 0.75);
    $size: 2.5em;
    $thickness: 0.5em;

    // Calculated variables.
    $lat: (
      $size - $thickness) / 2;
    $offset: $lat - $thickness;

    .loader {
      position: relative;
      width: $size;
      height: $size;
      transform: rotate(165deg
      );

    &:before,
    &:after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      width: $thickness;
      height: $thickness;
      border-radius: $thickness / 2;
      transform: translate(-50%, -50%);
    }

    &:before {
      animation: before 2s infinite;
    }

    &:after {
      animation: after 2s infinite;
    }
    }

    @keyframes before {
      0% {
        width: $thickness;
        box-shadow: $lat (
          -$offset) nth($colors, 1),
          (-$lat) $offset nth($colors, 3
        );
    }

    35% {
      width: $size;
      box-shadow: 0 (-$offset) nth($colors, 1),
        0 $offset nth($colors, 3);
    }

    70% {
      width: $thickness;
      box-shadow: (-$lat) (-$offset) nth($colors, 1),
        $lat $offset nth($colors, 3);
    }

    100% {
      box-shadow: $lat (
        -$offset) nth($colors, 1),
        (-$lat) $offset nth($colors, 3
      );
    }
    }

    @keyframes after {
      0% {
        height: $thickness;
        box-shadow: $offset $lat nth($colors, 2),
          (-$offset) (-$lat) nth($colors, 4);
      }

      35% {
        height: $size;
        box-shadow: $offset 0 nth($colors, 2),
          (-$offset) 0 nth($colors, 4);
      }

      70% {
        height: $thickness;
        box-shadow: $offset (
          -$lat) nth($colors, 2),
          (-$offset) $lat nth($colors, 4
        );
    }

    100% {
      box-shadow: $offset $lat nth($colors, 2),
        (-$offset) (-$lat) nth($colors, 4);
    }
    }

    .loader {
      position: absolute;
      top: calc(50% - #{$size / 2});
      left: calc(50% - #{$size / 2});
    }

    <script>
      var SYSTEM_MATH_DECIMAL = 6
      //函数部分
      //对数:
      function getLogValue(x, y) {
        if (y) {
          return dynamicFormulaRound(Math.log(y) / Math.log(x), SYSTEM_MATH_DECIMAL)
        }
        return dynamicFormulaRound(Math.log(x), SYSTEM_MATH_DECIMAL)
      }

      //幂函数
      function getPowValue(x, y) {
        return dynamicFormulaRound(Math.pow(x, y), SYSTEM_MATH_DECIMAL)
      }

      //开根函数
      function getRadicalValue(x, y) {
        if (y) {
          dynamicFormulaRound(Math.pow(x, 1 / y), SYSTEM_MATH_DECIMAL)
        }
        return dynamicFormulaRound(Math.pow(x, 1 / 2), SYSTEM_MATH_DECIMAL)
      }

      //绝对值
      function getAbsValue(x) {
        return Math.abs(x)
      }

      //平均数
      function getAvgValue() {
        let arr = []
        for (let i in arguments) {
          if (typeof (arguments[i]) === 'number' || typeof (arguments[i]) === 'string') {
            arr.push(arguments[i])
          }
        }
        console.log('getAvgValue', arr)
        if (arr.length > 0) {
          let sum = 0
          arr.forEach(item => {
            sum += item
          })
          return dynamicFormulaRound(sum / arr.length, SYSTEM_MATH_DECIMAL)
        }
        return 0
      }
      //最大值
      function getMaxValue() {
        let arr = [];
        for (let i in arguments) {
          if (typeof (arguments[i]) === 'number' || typeof (arguments[i]) === 'string') {
            arr.push(arguments[i]);
          }
        }
        console.log('getMaxValue', arr);
        if (arr.length > 0) {
          return Math.max(...arr);
        }
        return 0;
      }
      //最小值
      function getMinValue() {
        let arr = [];
        for (let i in arguments) {
          if (typeof (arguments[i]) === 'number' || typeof (arguments[i]) === 'string') {
            arr.push(arguments[i]);
          }
        }
        console.log('getMinValue', arr);
        if (arr.length > 0) {
          return Math.min(...arr);
        }
        return 0;
      }

      function LOGIC_IF(test, value1, value2) {
        return test ? value1 : value2;
      }

      /**
       * 四舍五入
       * @param  {[type]} num     [待处理数字]
       * @param  {[type]} decimal [需要保留的小数位]
       * @return {[type]}         []
       */
      function dynamicFormulaRound(num, decimal) {
        if (isNaN(num)) {
          return 0
        }
        const p1 = Math.pow(10, decimal + 1)
        const p2 = Math.pow(10, decimal)
        return Math.round(num * p1 / 10) / p2
      }

      function dateFormat(format, date) {
        var o = {
          'M+': date.getMonth() + 1, //month
          'd+': date.getDate(),    //day
          'h+': date.getHours(),   //hour
          'm+': date.getMinutes(), //minute
          's+': date.getSeconds(), //second
          'q+': Math.floor((date.getMonth() + 3) / 3),  //quarter
          'S': date.getMilliseconds() //millisecond
        }
        if (/(y+)/.test(format)) {
          format = format.replace(RegExp.$1,
            (date.getFullYear() + '').substr(4 - RegExp.$1.length))
        }
        for (var k in o) {
          if (new RegExp('(' + k + ')').test(format)) {
            format = format.replace(RegExp.$1,
              RegExp.$1.length == 1 ? o[k] :
                ('00' + o[k]).substr(('' + o[k]).length))
          }
        }
        return format
      }

      function refreshReport() {
        console.log('ELN调用触发')
        window.thisComponent.refreshReport()
      }
    </script>
